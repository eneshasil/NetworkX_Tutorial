format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-summary: "Kodu Göster"
    code-copy: true
    code-tools: false
    highlight-style: github
    anchor-sections: true
    include-after-body:
      text: |
        <script>
          document.addEventListener("DOMContentLoaded", function() {
            const cells = document.querySelectorAll(".cell");
            cells.forEach(function(cell) {
              const codeBlock = cell.querySelector(".sourceCode") || cell.querySelector(".code-fold");
              const output = cell.querySelector(".cell-output");
              if (codeBlock && output) {
                output.style.display = "none";
                output.style.opacity = "0";
                output.style.transition = "opacity 0.3s ease, max-height 0.3s ease";
                output.style.maxHeight = "0px";
                output.style.overflow = "hidden";
                
                const btn = document.createElement("button");
                btn.className = "run-code-btn";
                btn.innerHTML = "▶ Çıktıyı Gör";
                
                codeBlock.parentNode.insertBefore(btn, codeBlock.nextSibling);
                
                btn.addEventListener("click", function() {
                  if (output.style.display === "none") {
                    btn.innerHTML = "▼ Çıktıyı Gizle";
                    btn.classList.add("success");
                    
                    output.style.display = "block";
                    setTimeout(function() {
                      output.style.opacity = "1";
                      output.style.maxHeight = "1500px";
                    }, 50);
                  } else {
                    output.style.opacity = "0";
                    output.style.maxHeight = "0px";
                    setTimeout(function() {
                      output.style.display = "none";
                      btn.innerHTML = "▶ Çıktıyı Gör";
                      btn.classList.remove("success");
                    }, 200);
                  }
                });
              }
            });
          });
        </script>

editor: visual

